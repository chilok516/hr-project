services:
  api:
    build:
      context: ./api
    container_name: horse-racing-api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    networks:
      - horse-racing

  web:
    build:
      context: ./web
    container_name: horse-racing-web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-8321}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - horse-racing

networks:
  horse-racing:
    driver: bridge
